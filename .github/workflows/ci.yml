# Every push and every PR: typecheck, tests, and the cross-repo prompt check.
#
# Nothing here needs a Cloudflare token. The tests run in workerd against a
# throwaway D1 with fake bindings (vitest.config.ts), and `wrangler types` is
# local codegen, so CI never touches the real account. Deploying is still a
# person running `npm run deploy`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `wrangler types` regenerates worker-configuration.d.ts, which is
      # committed. If that file is stale the types CI checks against are not
      # the ones anybody edits, so say so rather than silently using fresh ones.
      - name: Typecheck
        run: |
          npm run typecheck
          if ! git diff --quiet -- worker-configuration.d.ts; then
            echo "::error::worker-configuration.d.ts is stale. Run 'npm run types' and commit it."
            git --no-pager diff -- worker-configuration.d.ts
            exit 1
          fi

      # This retry loop was written for what looked like a startup deadlock in
      # vitest-pool-workers: a hang with no output at all. It was not that. The
      # run was reaching the END of the suite, passing every test, and hanging
      # in teardown on a panel socket that test/relay.test.ts had opened and
      # nobody had waited for the Durable Object to let go of. The output was
      # missing only because this step kills with SIGKILL, and a killed process
      # loses whatever stdout is still sitting in its pipe buffer.
      #
      # Measured on one Mac, full suite, 10 runs each: 6/10 hung before the
      # fix, 0/10 after (relay suite alone: 5/6 before, 0/12 after). The tests
      # now close every socket through a helper that waits for the close.
      #
      # The loop stays as a net, not as the answer. If this starts retrying
      # again, suspect a newly opened socket that nothing waits on rather than
      # the pool, and reach for the same 10-run measurement before believing
      # any fix.
      #
      # The cap is sized against a healthy run, not against patience. A whole
      # passing job takes about 30 seconds here, so 150s is already five times
      # the headroom and a longer wait only buys a slower red. Six attempts at
      # 150s is 15 minutes worst case, inside the 20 minute job timeout, which
      # matters: the first version of this used three attempts of 300s, which
      # is exactly the old 15 minute timeout, so a bad streak was CANCELLED
      # rather than reported. A cancelled job tells you nothing.
      #
      # A run that FAILS rather than hangs stops immediately: only 137 and 124
      # retry, so a real failure can never be retried into a pass.
      - name: Tests
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "--- attempt $attempt ---"
            set +e
            timeout --signal=KILL 150 npx vitest run --reporter=verbose
            status=$?
            set -e
            if [ $status -eq 0 ]; then exit 0; fi
            if [ $status -ne 137 ] && [ $status -ne 124 ]; then
              echo "::error::tests failed (exit $status)"
              exit $status
            fi
            echo "::warning::attempt $attempt hung and was killed; retrying (known vitest-pool-workers startup deadlock)"
          done
          echo "::error::the test run hung on every attempt"
          exit 1

  # The lecture prompt lives in this repo AND in LectureAI, and they have
  # already drifted twice. The second time shipped an older set of action-item
  # rules to every account using managed keys, and nothing noticed until a
  # benchmark showed different output. This fails the build instead.
  prompt-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The lecture prompt must match LectureAI's
        run: |
          curl -fsSL -o /tmp/schemas.py \
            https://raw.githubusercontent.com/trace-J/LectureAI/main/intake/schemas.py
          python3 .github/workflows/prompt_parity.py /tmp/schemas.py src/prompts.ts
